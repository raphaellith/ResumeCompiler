name: Release

on:
  push:
    tags: "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt "pyinstaller==6.22.2"

      - name: Build Python sidecar with PyInstaller
        shell: bash
        run: |
          pyinstaller --onefile \
            --name backend \
            --add-data "backend/model/resources/template.tex:backend/model/resources/" \
            --collect-submodules uvicorn \
            backend/run.py

      - name: Smoke-test Python sidecar
        shell: bash
        run: |
          PORT=$(( 20000 + RANDOM % 20000 ))
          ./dist/backend --port "$PORT" >sidecar_smoke.log 2>&1 &
          SIDECAR_PID=$!
          HEALTH=""
          for _ in $(seq 1 30); do
            if HEALTH=$(curl -fsS -m 2 "http://127.0.0.1:$PORT/health" 2>/dev/null); then
              break
            fi
            sleep 2
          done
          kill "$SIDECAR_PID" 2>/dev/null || true
          if [ "$HEALTH" != '{"status":"ok"}' ]; then
            echo "Sidecar failed to boot:" >&2
            tail -n 40 sidecar_smoke.log >&2
            exit 1
          fi
          echo "Sidecar smoke test passed: $HEALTH"

      - name: Stage sidecar binary for Tauri
        shell: bash
        working-directory: frontend/resumecompiler
        run: |
          mkdir -p src-tauri/binaries
          cp "$GITHUB_WORKSPACE/dist/backend" "src-tauri/binaries/backend-${{ matrix.target }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/resumecompiler/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend/resumecompiler

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # webkit2gtk is not needed on macOS; Tauri uses WKWebView natively

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/resumecompiler/src-tauri

      - name: Clean old bundles from cache
        shell: bash
        run: rm -rf src-tauri/target/release/bundle
        working-directory: frontend/resumecompiler

      - name: Build Tauri application
        run: npm run tauri build
        working-directory: frontend/resumecompiler

      - name: Validate bundled sidecar boots and carries disable-library-validation
        shell: bash
        working-directory: frontend/resumecompiler
        run: |
          SIDECAR=$(find src-tauri/target/release/bundle/macos -type f -path "*/Contents/MacOS/backend" | head -n 1)
          if [ -z "$SIDECAR" ]; then
            echo "Bundled sidecar not found under src-tauri/target/release/bundle/macos" >&2
            exit 1
          fi
          if ! codesign -d --entitlements - "$SIDECAR" 2>&1 | grep -q "com.apple.security.cs.disable-library-validation"; then
            echo "Bundled sidecar is missing the disable-library-validation entitlement:" >&2
            codesign -d --entitlements - "$SIDECAR" >&2 2>&1 || true
            exit 1
          fi
          cp "$SIDECAR" ./bundled_backend
          chmod +x ./bundled_backend
          PORT=$(( 20000 + RANDOM % 20000 ))
          ./bundled_backend --port "$PORT" >bundled_smoke.log 2>&1 &
          BUNDLED_PID=$!
          HEALTH=""
          for _ in $(seq 1 30); do
            if HEALTH=$(curl -fsS -m 2 "http://127.0.0.1:$PORT/health" 2>/dev/null); then
              break
            fi
            sleep 2
          done
          kill "$BUNDLED_PID" 2>/dev/null || true
          if [ "$HEALTH" != '{"status":"ok"}' ]; then
            echo "Bundled (re-signed) sidecar failed to boot:" >&2
            tail -n 40 bundled_smoke.log >&2
            exit 1
          fi
          echo "Bundled sidecar validation passed: $HEALTH"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Résumé-Compiler-${{ matrix.target }}
          path: |
            frontend/resumecompiler/src-tauri/target/release/bundle/dmg/*.dmg
            frontend/resumecompiler/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn

  create-release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
